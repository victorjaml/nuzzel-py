name: Twitter Digest

on:
  schedule:
    # Adjust cron schedule based on desired interval
    # Example: 5am Los Angeles time = 1pm UTC every day
    # Runs every other day at 1:00 PM UTC (5:00 AM Los Angeles time)
    # Note: `*/2` is based on day-of-month and may vary slightly at month boundaries.
    - cron: '0 13 */2 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hours max

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Run digest
        env:
          # Every-other-day run should typically cover the last 2 days.
          DIGEST_TIME_WINDOW_DAYS: 2
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          TWITTER_CLIENT_TYPE: ${{ vars.TWITTER_CLIENT_TYPE || 'browser' }}
          TWITTER_SESSION_COOKIES: ${{ secrets.TWITTER_SESSION_COOKIES }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          # User ID: Either provide TWITTER_USER_ID directly (recommended) OR provide OAuth1 credentials
          # If TWITTER_USER_ID is not set, the browser client will fetch it from the API using OAuth1 credentials
          TWITTER_USER_ID: ${{ secrets.TWITTER_USER_ID }}
          # OAuth1 credentials (required only if TWITTER_USER_ID is not provided)
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          # Headless Chrome sends "HeadlessChrome" in its User-Agent/sec-ch-ua headers and X's
          # Cloudflare check blocks it ("Just a moment..."). Run headed Chrome on a virtual
          # display instead; xvfb is installed by `playwright install --with-deps`.
          BROWSER_HEADLESS: 'false'
          BROWSER_SLOW_MO_MS: '0'
        # Screen must be at least the 1920x1080 viewport; xvfb-run defaults to 640x480x8.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -m nuzzel.main

      - name: Upload debug screenshots
        if: always()  # Upload artifacts even if previous step failed
        uses: actions/upload-artifact@v6
        with:
          name: debug-screenshots
          path: debug_output/
          retention-days: 7
          if-no-files-found: ignore
